[project]
name = "scorenow-api-observer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "zoolake", email = "junhomoon224@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "typer>=0.27.2",
]

[project.scripts]
scorenow-api-observer = "scorenow_api_observer:main"
observer = "scorenow_api_observer.cli:app"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.6",
]

[tool.pyright]
venvPath="."
venv=".venv"
